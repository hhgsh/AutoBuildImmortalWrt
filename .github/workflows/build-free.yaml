name: build-free

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.2"
        type: choice
        options:
          - "25.12.2"
          - "25.12.1"
      custom_router_ip:
        description: "路由器管理地址"
        required: true
        default: "192.168.0.31"
      profile:
        description: "固件大小 (MB)"
        required: true
        default: "2048"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: |
          [ -f "${{ github.workspace }}/x86-64/build25.sh" ] && chmod +x ${{ github.workspace }}/x86-64/build25.sh || true
          [ -f "${{ github.workspace }}/shell/apk-custom-packages.sh" ] && chmod +x ${{ github.workspace }}/shell/apk-custom-packages.sh || true

      - name: Save Custom Router IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync u-boot-tools zstd wget

      - name: Download and Extract ImmortalWrt ImageBuilder
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          IB_URL="https://downloads.immortalwrt.org/releases/${luci_version}/targets/x86/64/immortalwrt-imagebuilder-${luci_version}-x86-64.Linux-x86_64.tar.zst"
          
          echo "Downloading ImageBuilder from: ${IB_URL}"
          wget -q --show-progress "${IB_URL}" -O imagebuilder.tar.zst
          
          mkdir -p /tmp/immortalwrt
          tar -I zstd -xf imagebuilder.tar.zst -C /tmp/immortalwrt --strip-components=1
          echo "IMAGEBUILDER_DIR=/tmp/immortalwrt" >> $GITHUB_ENV

      - name: Load & Export APK Custom Packages
        run: |
          cd $IMAGEBUILDER_DIR
          APK_SCRIPT="${{ github.workspace }}/shell/apk-custom-packages.sh"
          if [ -f "$APK_SCRIPT" ]; then
            echo "正在载入 shell/apk-custom-packages.sh ..."
            # 1. 使用 source 方式加载，保证变量不因子 Shell 退出而丢失
            source "$APK_SCRIPT"
            
            # 2. 将 CUSTOM_PACKAGES 写入 GITHUB_ENV 传递给后面的步骤
            echo "CUSTOM_PACKAGES=$CUSTOM_PACKAGES" >> $GITHUB_ENV
            echo "========================================="
            echo "已成功读取到以下自定义 APK 插件:"
            echo "$CUSTOM_PACKAGES"
            echo "========================================="
          else
            echo "未找到 shell/apk-custom-packages.sh，跳过此步骤。"
          fi

      - name: Build ImmortalWrt with Docker Container
        run: |
          # 传递并绑定参数
          PROFILE="${{ github.event.inputs.profile }}"
          CUSTOM_ROUTER_IP="${{ github.event.inputs.custom_router_ip }}"
          LUCI_VERSION="${{ github.event.inputs.luci_version }}"

          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="$PROFILE" \
            -e CUSTOM_ROUTER_IP="$CUSTOM_ROUTER_IP" \
            immortalwrt/imagebuilder:x86-64-openwrt-${LUCI_VERSION} /bin/bash /home/build/immortalwrt/build.sh

          # 收集生成的固件
          mkdir -p ${{ github.workspace }}/release_bin
          find bin/targets/x86/64/ -type f -name "*squashfs-combined-efi.img.gz" -exec cp -f {} ${{ github.workspace }}/release_bin/ \;

      - name: Create Release Info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 ImmortalWrt ${{ github.event.inputs.luci_version }} 固件信息
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Laohu-x86-64-${{ github.event.inputs.luci_version }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/release_bin/*squashfs-combined-efi.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
